server {
    listen 8080; # Puerto seguro 'unprivileged' que configuramos antes
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # Evita errores 404 al recargar rutas
    }

    # PROXY INVERSO PARA EL BACKEND DE VENTAS
    location /api/v1/ventas {
        # ⚠️ Cambiado a DNS interno de Kubernetes
        proxy_pass http://ventas-service:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PROXY INVERSO PARA EL BACKEND DE DESPACHOS
    location /api/v1/despachos {
        # ⚠️ Cambiado a DNS interno de Kubernetes
        proxy_pass http://despachos-service:8081; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}